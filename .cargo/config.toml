# Keep Cargo build artifacts OUT of the repo tree.
#
# Redirecting the target dir to a short path outside the repo keeps multi-GB build output
# out of git. (The repo moved off OneDrive to C:\dev on 2026-06-15 because cloud-sync
# reparse points broke native DLL loads; this redirect is still useful. Single-machine
# setup — adjust this path if you ever build on another machine.)
[build]
target-dir = "C:/Users/WSSco/.dhce-build"
