# Godot GDExtension adapter. Excluded from the default workspace — built on its own and
# the resulting cdylib + dhce.gdextension copied into the Godot project's addons/.
# `godot` (godot-rust/gdext) is MPL-2.0 (weak copyleft, confined to gdext's own files);
# pin its version to the project's Godot build (desolate-haven targets 4.6 → gdext 0.5).
[package]
name = "dhce-godot"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
description = "GDExtension adapter exposing dhce-core to the Godot desolate-haven game."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dhce-core = { path = "../dhce-core" }
godot = "0.5"
