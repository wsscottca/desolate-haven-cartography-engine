# Godot GDExtension adapter (Phase 8). Excluded from the default workspace — built on
# its own and the resulting cdylib + dhce.gdextension copied into the Godot project's
# addons/. `godot` (godot-rust/gdext) is dual MIT/Apache → used under the MIT election;
# pin its version to match the project's Godot 4.x build.
[package]
name = "dhce-godot"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
description = "GDExtension adapter exposing dhce-core to the Godot desolate-haven game."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dhce-core = { path = "../dhce-core" }
godot = "0.2"
