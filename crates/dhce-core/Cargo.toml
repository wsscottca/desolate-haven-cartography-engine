[package]
name = "dhce-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Desolate Haven Cartography Engine — shared generation + simulation core."
publish = false

[lib]
# rlib so native tests + the Godot adapter can link; the wasm adapter depends on it too.
crate-type = ["rlib"]

[dependencies]
# Permissive Delaunay (MIT-elect / ISC — validated by the license gate). We own the
# dual half-edge wrapper on top; PRNG + noise + Poisson sampling are our own.
delaunator = "1"
